name: Telegram Broadcast Digest

on:
  schedule:
    # Run 12 times a day (every 2 hours at the 30-minute mark)
    # - cron: '30 */2 * * *' # INTENDED FREQUENCY
    - cron: '30 10 * * *'    # TEMPORARY 1x/day UNTIL SEPT 1
  workflow_dispatch: # Allow manual triggers

concurrency:
  group: telegram_broadcast
  cancel-in-progress: false

jobs:
  broadcast:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Send Telegram Broadcast
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cd backend
          python scripts/send_telegram_digest.py
